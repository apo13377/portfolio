<body>

<h1>JavaScript</h1>

<p>JavaScript makes a webpage interactive.</p>

<h3>Example</h3>

<button onclick="change()">Click</button>
<p id="text">Hello</p>

<script>
function change(){
    document.getElementById("text").innerHTML = "You clicked the button";
}
</script>

<p>When you click the button, the text changes.</p>
